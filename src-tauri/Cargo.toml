[package]
name = "keymaster-linux"
version = "0.5.1"
description = "KeyMaster Linux — Desktop Keyboard & Mouse Automation Utility"
authors = ["KeyMaster Pro Team"]
edition = "2024"

[lib]
name = "keymaster_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# GUI
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime / provider HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI args (--daemon / --mcp flags)
clap = { version = "4", features = ["derive"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Regex (Layer Window Title matching)
regex = "1"

# Logging facade
log = "0.4"

# Linux: evdev input capture, uinput injection, X11 window context, KDE Wayland via DBus
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
x11rb = { version = "0.13", features = ["randr", "dpms"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
arboard = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
